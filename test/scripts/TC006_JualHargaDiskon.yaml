# Doc: doc/test/TC-006-jual-harga-diskon.md
# TC-006 — Jual 1pcs harga 1000 diskon 1000, total Rp0 (write path).
# NOTE: Picker product selection does NOT add items to order (app-side limitation).
# Flow opens picker and selects variant, but "Belum ada produk ditambahkan."
# persists after returning to Catat Penjualan sheet. Requires app-side fix.
appId: handika.oura-studio-frontend
---
# 1. Launch + tab Penjualan
- launchApp
- tapOn: "Penjualan"
- assertVisible: "Penjualan"
- takeScreenshot: TC006_01_Penjualan

# 2. Buka sheet catat penjualan
- tapOn: "Add"
- assertVisible: "Catat Penjualan"
- assertVisible: "Belum ada produk ditambahkan."
- takeScreenshot: TC006_02_SheetKosong

# 3. Buka picker dan pilih variant (produk tidak masuk ke order — app limitation)
- tapOn: "Tambah Produk"
- assertVisible: "Pilih Produk"
- scroll
- takeScreenshot: TC006_03_Picker
- tapOn: "L, Rp18.000, 1 pcs"
- takeScreenshot: TC006_04_ItemDitambah

# 4. Kembali ke sheet — produk masih belum ditambahkan (app limitation)
- tapOn: "Batal"
- assertVisible: "Belum ada produk ditambahkan."
